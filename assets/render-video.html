<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador do manifesto visual | Instituto Esperança</title>
  <style>body{margin:0;background:#0e2c4a;color:white;font:16px Arial,sans-serif}canvas{display:block;max-width:100%;height:auto}p{margin:24px}</style>
</head>
<body>
  <canvas id="manifesto" width="960" height="540" aria-label="Manifesto visual do Instituto Esperança"></canvas>
  <p>Arquivo de produção. O vídeo pronto está em <a href="manifesto.webm" style="color:#f5ca62">manifesto.webm</a>.</p>
  <script>
  const canvas = document.querySelector('canvas');
  const context = canvas.getContext('2d');
  const slides = [
    {label:'NOSSA PROPOSTA',lines:['Esperança','que acolhe.'],detail:'Solidariedade que transforma.',word:'ACOLHER'},
    {label:'EDUCAÇÃO E INCLUSÃO',lines:['Oportunidades','para crescer.'],detail:'Aprender, participar e pertencer.',word:'INCLUIR'},
    {label:'CUIDADO COMPARTILHADO',lines:['Pessoas e planeta.','O mesmo cuidado.'],detail:'Acolhimento e consciência ambiental.',word:'CUIDAR'},
    {label:'CADA GESTO IMPORTA',lines:['O próximo passo','pode ser seu.'],detail:'Conheça os projetos e as formas de participar.',word:'PARTICIPAR'}
  ];
  function paint(time) {
    const index = Math.min(3, Math.floor(time / 3.5));
    const slide = slides[index];
    context.fillStyle = '#102f50'; context.fillRect(0,0,960,540);
    context.fillStyle = '#f6c65c'; context.fillRect(0,0,10,540);
    context.font = 'bold 14px Arial'; context.fillStyle='#e5edf4';
    context.fillText('INSTITUTO ESPERANÇA', 64, 66);
    context.fillStyle='#f6c65c'; context.font='bold 12px Arial';
    context.fillText(slide.label,64,143);
    context.fillStyle='#ffffff'; context.font='bold 50px Arial';
    slide.lines.forEach((line,i)=>context.fillText(line,64,218+i*60));
    context.fillStyle='#d0dfec'; context.font='18px Arial';
    context.fillText(slide.detail,64,342);
    context.save();
    context.translate(786,244);
    context.strokeStyle='#f6c65c'; context.lineWidth=3;
    for(let i=0;i<12;i++){
      const angle=i*Math.PI/6 + time*0.04;
      context.beginPath();context.moveTo(Math.cos(angle)*73,Math.sin(angle)*73);
      context.lineTo(Math.cos(angle)*93,Math.sin(angle)*93);context.stroke();
    }
    context.fillStyle='#f6c65c';context.beginPath();context.arc(0,0,51,0,Math.PI*2);context.fill();
    context.fillStyle='#102f50'; context.font='bold 30px Arial'; context.textAlign='center';
    context.fillText('0'+(index+1),0,11);context.restore();
    context.font='bold 13px Arial'; context.fillStyle='#f6c65c'; context.textAlign='center';
    context.fillText(slide.word,786,380);context.textAlign='left';
    context.fillStyle='#34516d';context.fillRect(64,439,832,1);
    for(let i=0;i<4;i++) {context.fillStyle=i===index?'#f6c65c':'#496179';context.fillRect(64+i*42,467,30,3);}
    context.font='11px Arial';context.fillStyle='#b6c8d8';
    context.fillText('Instituto Esperança',690,474);
  }
  paint(0);
  window.renderVideo = async function() {
    if (!window.MediaRecorder || !canvas.captureStream) throw new Error('MediaRecorder indisponível');
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm;codecs=vp8';
    const stream = canvas.captureStream(20);
    const recorder = new MediaRecorder(stream,{mimeType,videoBitsPerSecond:650000});
    const chunks=[];
    recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
    const result = new Promise((resolve,reject)=>{
      recorder.onerror=reject;
      recorder.onstop=()=>{
        stream.getTracks().forEach(track=>track.stop());
        const blob = new Blob(chunks,{type:'video/webm'});
        const reader = new FileReader();
        reader.onload=()=>resolve({base64:reader.result.split(',')[1],mimeType:'video/webm',bytes:blob.size});
        reader.onerror=reject;reader.readAsDataURL(blob);
      };
    });
    recorder.start();
    const started=performance.now();
    const timer=setInterval(()=>{
      const elapsed=(performance.now()-started)/1000;
      paint(Math.min(elapsed,13.99));
      if(elapsed>=14){clearInterval(timer);recorder.stop();}
    },50);
    return result;
  };
  </script>
</body>
</html>
